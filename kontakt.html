    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        #pdf-viewer {
            width: 65vw; /* Bruk viewport-enheter for bredde */
            max-width: 100%; /* Sørg for at den ikke overstiger 100% bredde */
            border: 1px solid #ddd;
            overflow: hidden;
            border-radius: 25px;
            margin: 50px auto; /* Sentrer elementet */
            display: flex;
            flex-direction: column; /* Vis flere sider vertikalt */
            justify-content: center; /* Sentrer innholdet */
            align-items: center; /* Sentrer innholdet vertikalt */
            padding: 0; /* Fjern padding */
        }
        .pdf-page {
            width: 100%; /* Sørg for at PDF-sidene fyller hele bredden */
            height: auto; /* Juster høyden automatisk */
            margin-bottom: 20px; /* Legg til margin mellom sidene */
        }
        button {
            padding: 10px 15px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .footer {
            position: relative;
            bottom: 0;
            width: 100%;
            height: 50vh;
            color: white;
            text-decoration: none;
            background-color: rgb(48, 53, 90);
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 100px; /* Øk marginen øverst for å unngå overlapping */
        }
        .copy-btn-container {
            display: flex;
            justify-content: center;
            margin-bottom: 50px; /* Legg til margin nederst for å unngå overlapping */
        }

        /* Media queries for mobile devices */
        @media (max-width: 768px) {
            #pdf-viewer {
                width: 90vw; /* Øk bredden for mobilvisning */
                margin: 20px auto; /* Juster marginene for mobilvisning */
            }
            .pdf-page {
                width: 100%; /* Sørg for at PDF-sidene fyller hele bredden */
                height: auto; /* Juster høyden automatisk */
            }
            .copy-btn-container {
                display: flex; /* Sørg for at knappen vises på mobil */
                justify-content: center;
                margin-bottom: 20px; /* Juster marginen for mobil */
            }
        }
    </style>
</head>
